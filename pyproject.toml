[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "los-churuguaros-fefo"
version = "1.0.0"
description = "Sistema integral para charcuteria con inventario FEFO y cumplimiento normativo venezolano."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Los Churuguaros" }
]
dependencies = []

[project.scripts]
churuguaros = "los_churuguaros.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
