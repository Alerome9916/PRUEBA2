{% extends 'base.html' %}
{% block title %}{{ 'Editar' if c else 'Nuevo' }} cliente{% endblock %}
{% block content %}
<h1 class="section-title">{{ 'Editar' if c else 'Nuevo' }} cliente</h1>
<form method="post" class="card">
  <div class="form-grid">
    <div class="form-group">
      <label>Tipo doc *</label>
      <select name="tipo_doc">
        {% for t in ['V','E','J','G','P'] %}
          <option value="{{ t }}" {% if c and c.tipo_doc==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Documento *</label>
      <input type="text" name="documento" required value="{{ c.documento if c else '' }}">
    </div>
    <div class="form-group">
      <label>Nombre / Razón social *</label>
      <input type="text" name="nombre" required value="{{ c.nombre if c else '' }}">
    </div>
    <div class="form-group">
      <label>Teléfono</label>
      <input type="tel" name="telefono" value="{{ c.telefono if c else '' }}">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="{{ c.email if c else '' }}">
    </div>
    <div class="form-group">
      <label class="checkbox">
        <input type="checkbox" name="acepta_notificaciones" {% if not c or c.acepta_notificaciones %}checked{% endif %}>
        Acepta notificaciones de promociones
      </label>
    </div>
  </div>
  <div class="form-group" style="margin-top:14px;">
    <label>Dirección</label>
    <textarea name="direccion">{{ c.direccion if c else '' }}</textarea>
  </div>
  <div class="form-actions">
    <button class="btn" type="submit">Guardar</button>
    <a class="btn btn-secondary" href="{{ url_for('clientes.listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
